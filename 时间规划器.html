<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时间规划</title>
<style>
:root{
  --bg:#FFFFFF;
  --panel:#F6F6F1;
  --ink:#0B0B0A;
  --ink-2:#6A6A66;
  --ink-3:#B0B0AA;
  --line:#EDEDE9;
  --line-2:#E2E2DD;
  --accent:#00B37E;
  --accent-soft:#E2F9F1;
  --danger:#E5484D;
  --top:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe,body.resizing *{user-select:none !important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}
::selection{background:#DCF8EE;color:#0B0B0A}

/* ---------- 顶栏 ---------- */
.topbar{
  height:var(--top,96px);display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;position:relative;z-index:30;background:var(--bg);
}
.tb-left{display:flex;align-items:baseline;gap:13px;min-width:0;overflow:hidden}
.range-main{
  font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--ink);
  line-height:1;white-space:nowrap;flex:none;
}
.range-sub{
  font-size:40px;font-weight:800;letter-spacing:-.03em;color:#D8D8D2;line-height:1;
  flex:none;white-space:nowrap;
}
.tb-right{display:flex;align-items:center;gap:7px}
.arrow{
  width:32px;height:32px;border-radius:50%;background:#0B0B0A;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.arrow svg{display:block}
.arrow:hover{background:#2E2E2B}
.today-btn{
  height:32px;padding:0 15px;border-radius:999px;
  font-size:14.5px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);background:#fff;
  letter-spacing:.01em;
}
.today-btn:hover{background:#0B0B0A;color:#fff}
.seg{
  position:relative;display:flex;border:1.5px solid var(--ink);border-radius:999px;
  padding:2px;height:32px;background:#fff;
}
.seg-thumb{
  position:absolute;top:2px;bottom:2px;left:2px;width:44px;border-radius:999px;
  background:#0B0B0A;z-index:0;
  transition:left .42s cubic-bezier(.34,1.9,.5,1),width .42s cubic-bezier(.34,1.9,.5,1),opacity .18s;
}
.seg.no-thumb .seg-thumb{opacity:0}
.seg button{
  position:relative;z-index:1;padding:0 14px;border-radius:999px;font-size:14.5px;font-weight:700;
  color:var(--ink);line-height:1;background:transparent;letter-spacing:.02em;
  transition:color .18s;
}
.seg button.on{color:#fff}
.primary{
  height:32px;padding:0 17px;border-radius:999px;background:#0B0B0A;color:#fff;
  font-size:14.5px;font-weight:700;letter-spacing:.03em;
}
.primary:hover{background:#2E2E2B}
/* 视图切换：只用一个图形，图标随状态对调 */
.viewbtn{transition:background .16s,color .16s,border-color .16s}
.viewbtn.on{background:#0B0B0A;color:#fff;border-color:#0B0B0A}
.viewbtn .i-list{display:none}
.viewbtn.on .i-list{display:block}
.viewbtn.on .i-grid{display:none}
.viewbtn.on svg{animation:iconPop .38s cubic-bezier(.34,1.9,.5,1)}
@keyframes iconPop{0%{transform:scale(.55) rotate(-18deg);opacity:0}100%{transform:none;opacity:1}}
.ghost-btn{
  height:32px;padding:0 13px;border-radius:999px;border:1.5px solid var(--ink);
  font-size:13px;color:var(--ink);background:#fff;
}
.ghost-btn:hover{background:#0B0B0A;color:#fff}
.icon-btn{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  background:#fff;transition:border-color .12s,color .12s,background .12s;
}
.icon-btn:hover{border-color:var(--ink-3);color:var(--ink);background:#FCFCFA}
.viewbtn.on:hover{background:#0B0B0A;color:#fff;border-color:#0B0B0A}
.icon-btn svg{display:block}

/* ---------- 布局 ---------- */
.layout{display:flex;height:calc(100vh - var(--top,96px))}

/* ---------- 网格 ---------- */
.canvas{flex:1;overflow:auto;overflow-anchor:none;position:relative;min-width:0;background:var(--bg);padding-left:30px}
.canvas::-webkit-scrollbar{width:10px;height:10px}
.canvas::-webkit-scrollbar-thumb{background:#E4E4DF;border-radius:5px;border:3px solid #fff}
.canvas::-webkit-scrollbar-thumb:hover{background:#D0D0CA}

.grid{--hour-h:56px}
.grid.v-day{--hour-h:64px;max-width:800px;margin:0 auto}

.grid-head{
  display:flex;position:sticky;top:0;z-index:20;background:var(--bg);
  gap:18px;padding-top:3px;
}
.gh-gutter{width:48px;flex:none}
/* 高度锁死：日视图字号更大，但行高不变，字只能往上长，横线和时间面板都不动 */
.gh-day{
  flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:space-between;
  min-height:42px;padding:0 1px 8px;border-bottom:2.5px solid var(--ink);
  position:relative;cursor:pointer;
}
.gh-day .gd{
  font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
.gh-day .gn{font-size:14px;font-weight:600;color:#9C9B95;letter-spacing:.02em}
.gh-day .meta{display:flex;align-items:baseline;gap:10px}
.gh-day .gx{font-size:13.5px;font-weight:600;color:#9C9B95;letter-spacing:.02em;white-space:nowrap}
/* 日视图空间大，星期和「明天/3天后」都放大一档 */
.grid.v-day .gh-day .meta{gap:14px}
.grid.v-day .gh-day .gn{font-size:19px}
.grid.v-day .gh-day .gx{font-size:18px}
/* 周视图一列窄，日期写成「10月12日」要收一档 */
.grid.v-week .gh-day .gd{font-size:16.5px;letter-spacing:-.025em}
.grid.v-week .gh-day .gn{font-size:12.5px}
/* 列再窄一档就放不下「10月18日 + 周五」了，字号再收一档，绝不让它折成两行把时间轴顶下去 */
.grid.v-week.narrow .gh-day .gd{font-size:14px;letter-spacing:-.02em}
/* 窄到连「10月26日 + 周一」都排不下一行时：日期和星期改成上下两行，行高不变 */
.grid .gh-day .gd{white-space:nowrap;flex:none}
.grid .gh-day .meta{flex:none}
.grid.tiny .gh-day{flex-wrap:wrap;align-content:flex-end;row-gap:1px}
.grid.tiny.v-week .gh-day .gd{font-size:12.5px;letter-spacing:-.02em}
.grid.tiny .gh-day .gn{font-size:11px}
.grid.tiny .gh-day .meta{margin-left:auto}
.grid.micro.v-week .gh-day .gd{font-size:10.5px}
.grid.micro .gh-day .gn{font-size:9.5px}
/* 周→日变形时被挤走的六天：字号还是周视图那一档，不能跟着主列放大 */
.grid .gh-day.sqz .gd{font-size:16.5px;letter-spacing:-.025em}
.grid .gh-day.sqz .gn{font-size:12.5px}
.grid .gh-day.sqz .gx{font-size:13.5px}
.grid .gh-day.sqz.narrow .gd{font-size:14px;letter-spacing:-.02em}
.gh-day.is-today .gd,.gh-day.is-today .gn{color:var(--accent)}
.gh-day.is-sel .gd,.gh-day.is-sel .gn{color:var(--accent)}
.gh-day.is-sel{border-bottom-color:var(--accent);border-bottom-width:3.5px;padding-bottom:7px}

.grid-body{display:flex;position:relative;padding-top:13px}
.gutter{width:66px;flex:none;position:relative}
.tick{
  position:absolute;right:11px;font-size:12px;color:var(--ink-3);
  transform:translateY(-50%);font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
/* 当前时间的小幽灵 */
.now-ghost{
  position:absolute;left:1px;transform:translateY(-50%);
  pointer-events:none;z-index:6;line-height:0;
  filter:drop-shadow(0 1px 2px rgba(11,11,10,.14));
}
.now-ghost svg{display:block;animation:ghostFloat 3s ease-in-out infinite}
@keyframes ghostFloat{
  0%,100%{transform:translateY(-1.6px)}
  50%{transform:translateY(1.6px)}
}
.cols{
  flex:1;display:flex;gap:18px;position:relative;min-width:0;
  background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,.055) 0 1px,transparent 1px var(--hour-h));
}
.day-col{
  flex:1;min-width:0;position:relative;
  height:calc(var(--hour-h) * var(--hours,18));
}

/* ---------- 任务块 ---------- */
.blk{
  position:absolute;
  left:calc(1px + (100% - 2px) * var(--l,0) / var(--n,1));
  width:calc((100% - 2px) / var(--n,1) - 3px);
  /* 上下各留 3px 缝：两块首尾相接时不至于黏成一条，圆角才看得出来 */
  top:calc(var(--t) * var(--hour-h));
  height:calc(var(--d) * var(--hour-h) - 3px);
  border-radius:11px;background:var(--c,#DCE7FF);
  border:none;
  padding:5px 8px;overflow:hidden;cursor:grab;user-select:none;
  min-height:15px;transition:box-shadow .12s,background .15s;
  display:flex;flex-direction:column;
}
.blk:hover{box-shadow:0 3px 12px rgba(20,20,15,.14)}
.blk:active{cursor:grabbing}
.blk .bw{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;overflow:hidden}
.blk:not(:has(.bs)) .bw{justify-content:center}
.blk .bt{
  position:relative;
  font-size:var(--fs,13.5px);font-weight:600;color:var(--ink);line-height:1.28;
  overflow:hidden;padding-right:4px;word-break:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:var(--lines,1);
}
.blk .bt .dot{display:none}
.blk[data-tall="1"] .bt{padding-right:21px}
/* 划掉任务：一条细线从左往右划过去，划完这条临时线自己淡掉，
   最终留下的是文字自带的删除线（多行也齐、只到文字宽度为止） */
.blk .bt::after{
  content:"";position:absolute;left:0;top:.64em;height:2px;width:min(100%,var(--sw,100%));
  background:rgba(11,11,10,.6);border-radius:2px;pointer-events:none;
  opacity:0;transform:scaleX(0);transform-origin:left center;
}
.blk.done.anim .bt::after{
  animation:strikeGrow .3s cubic-bezier(.22,.61,.36,1) both,
            barFade .1s linear .3s both;
}
.blk .bs{
  font-size:var(--fs2,11px);color:rgba(11,11,10,.52);margin-top:auto;line-height:1.12;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
}
/* 泳道太窄时时间拆两行，宁可占高一截也不把结束时间吃掉 */
.blk .bs2{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.blk .bs2 i{font-style:normal}
/* 完成态：同色系褪成浅色，不用透明度 */
.blk.done{background:color-mix(in srgb, var(--c,#DCE7FF) 62%, #fff)}
.blk.done .bt{
  text-decoration:line-through;text-decoration-thickness:1.5px;
  color:rgba(11,11,10,.5);
}
/* 刚点下去这一下：先让线自己长完，再补上多行的删除线 */
.blk.done.anim .bt{text-decoration-color:transparent;animation:inkStrike .01s linear .28s forwards}
.blk.done .bs{color:rgba(11,11,10,.32)}
.blk.conflict{box-shadow:inset 0 0 0 1.5px rgba(11,11,10,.55)}
.blk.sel{box-shadow:0 0 0 2px rgba(11,11,10,.9),0 3px 12px rgba(20,20,15,.14)}
.blk.draft{outline:2px dashed rgba(11,11,10,.4);outline-offset:-2px}
.blk .rz{position:absolute;left:0;right:0;height:7px;cursor:ns-resize}
.blk .rz.t{top:-1px}
.blk .rz.b{bottom:-1px}
/* 完成圈：30px 透明定位盒 + 18px 视觉圆；未完成时里面也留一个淡对勾当暗示 */
.blk .chk{
  position:absolute;right:1px;top:1px;width:30px;height:30px;
  border-radius:50%;background:transparent;opacity:0;display:none;
  align-items:center;justify-content:center;
  transition:opacity .12s;
}
.blk[data-tall="1"] .chk{display:flex}
.blk:hover .chk,.blk .chk.on{opacity:1}
.chk-box{
  width:18px;height:18px;border-radius:50%;background:#fff;
  border:1.5px solid #A9A9A3;
  display:flex;align-items:center;justify-content:center;
  transition:background .16s,border-color .16s,transform .16s;
}
.chk svg{width:12px;height:12px;display:block;overflow:visible}
.chk path{
  fill:none;stroke:rgba(11,11,10,.3);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .16s;
}
.chk:hover .chk-box{border-color:var(--ink);transform:scale(1.07)}
.chk.on .chk-box{background:var(--ink);border-color:var(--ink)}
.chk.on path{stroke:#fff}
/* 点下去那一下：圈弹一下，勾从左往右画出来 */
.chk.anim .chk-box{animation:chkPop .42s cubic-bezier(.34,1.9,.5,1)}
.chk.on.anim path{
  stroke-dasharray:11;stroke-dashoffset:11;
  animation:chkDraw .3s cubic-bezier(.22,.61,.36,1) .07s forwards;
}
@keyframes chkPop{0%{transform:scale(.62)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes chkDraw{to{stroke-dashoffset:0}}
@keyframes strikeGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes inkStrike{to{text-decoration-color:currentColor}}
@keyframes barFade{from{opacity:.85}to{opacity:0}}

/* 拖动时目标列提示 */
.day-col.drop-on{background:rgba(15,110,86,.045);border-radius:4px}

/* ---------- 列表视图：每天一列，列内是带细横线的清单 ----------
   模仿的是「一周七列、任务只占一个小色块、从上往下排队」的样子：
   没有时间轴、不按时间定位、块与块之间用一条浅横线隔开，
   空日期也照样画满横线，整屏看下来是一张有格的纸。 */
.lv{display:none;padding:2px 12px 60px 0}
body.is-list .lv{display:block}
body.is-list .grid{display:none}
body.is-list .canvas{padding-left:20px}
.lv-cols{display:flex;gap:var(--lvg,19px);align-items:flex-start}

.lv-col{flex:1;min-width:0}
.lv-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  min-height:38px;padding:0 1px 7px;overflow:hidden;
  border-bottom:2.5px solid var(--ink);
  position:sticky;top:0;z-index:6;background:var(--bg);
}
.lv-date{
  font-size:var(--lvfd,16.5px);font-weight:800;letter-spacing:-.025em;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.lv-dow{
  font-size:calc(var(--lvfd,16.5px) * .76);font-weight:700;color:#9C9B95;
  letter-spacing:.02em;white-space:nowrap;
}
/* 列窄到日期＋星期排不下一条：星期先撤，日期留着 */
.lv.narrow .lv-dow{display:none}
.lv-col.is-today .lv-date,.lv-col.is-today .lv-dow{color:var(--accent)}
.lv-col.is-today .lv-head{border-bottom-color:var(--accent)}

/* 一行 = 一条任务或一个空格子。
   行高直接用时间块视图的「每小时高度」，切视图时纵向节奏是同一个，不会一个松一个挤 */
.lv-row{
  display:flex;align-items:center;gap:6px;
  height:var(--lvrh,56px);padding:0 1px;border-bottom:1px solid #F2F1EB;
  cursor:pointer;position:relative;
}
.lv-row[data-id]{cursor:grab}
.lv-row[data-id]:active{cursor:grabbing}
.lv-row[data-id]:hover{background:#FAFAF5}
.lv-row.is-empty::after{
  content:"＋";font-size:13px;line-height:1;color:#C6C5BD;
  opacity:0;transition:opacity .12s;
}
.lv-row.is-empty:hover::after{opacity:1}

/* 任务本体：一个按文字宽度收放的胶囊，底色是类别的深色，白字 */
.lv-chip{
  display:inline-flex;align-items:center;min-width:0;max-width:100%;
  height:var(--lvch,28px);
  padding:0 9px;border-radius:999px;background:var(--c,#B282FF);color:#fff;
  user-select:none;
  transition:opacity .16s,transform .14s,box-shadow .14s;
}
.lv-ct{
  display:block;min-width:0;font-style:normal;
  font-size:var(--lvfc,12.5px);font-weight:700;letter-spacing:.01em;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lv-row[data-id]:hover .lv-chip{transform:translateY(-.5px)}
.lv-chip.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(11,11,10,.5)}
/* 划掉：胶囊从深色退回淡色，字压灰，一条黑线穿过去。
   不用整体降透明度——降完白线也跟着淡，划掉这件事就看不出来了 */
.lv-row.done .lv-chip{background:var(--c2,#EDEBE4);color:rgba(11,11,10,.6)}
.lv-row.done .lv-ct{
  text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:rgba(11,11,10,.55);
}
.lv-row.done.anim .lv-ct{
  text-decoration-color:transparent;
  animation:inkStrikeInk .01s linear .28s forwards;
}
@keyframes inkStrikeInk{to{text-decoration-color:rgba(11,11,10,.55)}}

/* 完成圈：平时藏着，鼠标移到这一行才出来；
   已完成的行不再常显——胶囊本身已经淡掉划掉了，再挂一个黑圈反而扎眼。
   它绝对定位压在行尾，底下一层和行底色同色的圆盘把胶囊挡开，
   这样长标题不必为了给它让位而被截掉 */
.lv-row .chk{
  position:absolute;right:-1px;top:50%;transform:translateY(-50%);
  display:flex;width:23px;height:23px;border-radius:50%;
  background:#FAFAF5;box-shadow:0 0 0 1.5px #FAFAF5;opacity:0;
}
.lv-row:hover .chk{opacity:1}
.lv-row .chk-box{width:16px;height:16px;border-width:1.4px}
.lv-row .chk svg{width:11px;height:11px}
.lv-row .chk path{stroke:rgba(11,11,10,.32)}

/* 拖动：手上那个胶囊浮起来跟着走，原位置留个淡影；
   落点用一条黑线标出来，插在哪两条之间一目了然 */
.lv-ghost{
  position:fixed;z-index:999;pointer-events:none;margin:0;
  transform:translate(-50%,-50%) scale(1.04);
  box-shadow:0 10px 24px rgba(11,11,10,.22);
}
.lv-row.dragging .lv-chip{opacity:.28}
.lv-row.drop-before::before{
  content:"";position:absolute;left:0;right:0;top:-1.5px;height:3px;
  border-radius:2px;background:var(--ink);z-index:3;
  pointer-events:none;
}
/* 落在整列最后一条下面：线画在那一行的下沿 */
.lv-row.drop-after{box-shadow:inset 0 -3px 0 var(--ink)}
.lv-col.drop-on{background:rgba(11,11,10,.022);border-radius:6px}

/* 切换上/下周时的滑入过渡 */
@keyframes slideFromRight{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideFromLeft{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.grid-head.slide-l,.grid-body.slide-l{animation:slideFromRight .3s cubic-bezier(.22,.61,.36,1)}
.grid-head.slide-r,.grid-body.slide-r{animation:slideFromLeft .3s cubic-bezier(.22,.61,.36,1)}

/* 视图切换：字号和列宽跑同一条时间线（都是 400ms、同一条曲线），不分成前后两段。
   每个元素带一个 --tpS = 上一档字号 / 本档字号，缩放从它开始长到 1，走位用 transform 不触发重排。 */
@keyframes tpPop{from{transform:scale(var(--tpS,1))}to{transform:none}}
.grid.pop-in .gh-day .gd,.grid.pop-in .gh-day .gn,.grid.pop-in .gh-day .gx,
.grid.pop-in .blk .bt,.grid.pop-in .blk .bs{animation:tpPop .4s cubic-bezier(.45,0,.25,1)}
.grid.pop-out .gh-day .gd,.grid.pop-out .gh-day .gn,.grid.pop-out .gh-day .gx,
.grid.pop-out .blk .bt,.grid.pop-out .blk .bs{animation:tpPop .4s cubic-bezier(.45,0,.25,1)}
.grid .gh-day .gd{transform-origin:left bottom}
.grid .gh-day .gn,.grid .gh-day .gx{transform-origin:right bottom}
.grid .blk .bt{transform-origin:left top}
.grid .blk .bs{transform-origin:left bottom}

/* ---------- 右栏 ---------- */
.pool{
  width:347px;flex:none;display:flex;flex-direction:column;
  background:var(--panel);border-radius:22px;
  margin:6px 18px 18px 30px;padding:18px 26px 0 24px;
  position:relative;min-width:0;
}
.pool-resizer{
  position:absolute;left:-7px;top:0;bottom:0;width:14px;cursor:col-resize;z-index:6;
}
.pool-resizer::before{
  content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;
  background:transparent;border-radius:1px;transition:background .12s;
}
.pool-resizer:hover::before,.pool-resizer.on::before{background:#D2D2CC}
.pool-head{
  padding:0 0 15px;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pool-add{padding:10px 0 0}
.pool-trigger{
  width:100%;height:42px;border-radius:12px;border:1.5px dashed #D8D8D1;
  text-align:left;padding:0 13px;font-size:14.5px;color:var(--ink-3);
  background:transparent;transition:border-color .12s,color .12s,background .12s;
}
.pool-trigger:hover{border-color:#BFBFB7;color:var(--ink);background:#fff}
.pool-editor{display:none}
.pool-add.editing .pool-trigger{display:none}
.pool-add.editing .pool-editor{display:block}
.pool-editor textarea{
  display:block;width:100%;min-height:52px;max-height:132px;resize:none;
  border:1.5px solid #C6C6BE;border-radius:12px;background:#fff;
  padding:11px 13px;font-size:14.5px;line-height:1.5;color:var(--ink);
  transition:border-color .12s,box-shadow .12s;
}
.pool-editor textarea:focus{
  border-color:#0B0B0A;
  box-shadow:0 0 0 3px rgba(11,11,10,.055),0 8px 22px rgba(0,0,0,.07);
}
.pool-editor textarea::placeholder{color:#BDBDB6}
.pool-editor-foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:9px}
.pool-editor-foot button{height:30px;padding:0 15px;border-radius:999px;font-size:13.5px}
.pool-editor-foot .pe-cancel{color:var(--ink-3);border:1px solid var(--line-2);background:#fff}
.pool-editor-foot .pe-cancel:hover{color:var(--ink-2);border-color:#CFCFC8}
.pool-editor-foot .pe-add{background:#0B0B0A;color:#fff}
.pool-editor-foot .pe-add:hover{background:#2E2E2B}
.pool-list{flex:1;overflow-y:auto;padding:1px 0 4px;margin:0 -2px;padding-left:2px;padding-right:2px}
.pool-list::-webkit-scrollbar{width:8px}
.pool-list::-webkit-scrollbar-thumb{background:#E2E2DC;border-radius:4px;border:2px solid var(--panel)}
.pool-item{
  display:flex;align-items:center;gap:8px;padding:11px 12px;margin-bottom:8px;
  background:#fff;border:1px solid #E7E7DF;border-radius:12px;
  box-shadow:0 1px 3px rgba(16,16,12,.055);
  font-size:14.5px;color:#47473F;cursor:grab;line-height:1.45;user-select:none;
  transition:border-color .14s,box-shadow .14s,transform .14s;
}
.pool-item:hover{
  color:var(--ink);border-color:#D5D5CB;
  box-shadow:0 4px 14px rgba(16,16,12,.09);
}
.pool-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pool-item .px{
  width:20px;height:20px;flex:none;border-radius:50%;color:var(--ink-3);
  display:none;align-items:center;justify-content:center;font-size:16px;line-height:1;
}
.pool-item:hover .px{display:flex}
.pool-item .px:hover{color:var(--danger);background:#F7F1F0}
/* 点开就地改文字 */
.pool-item.editing{
  cursor:default;border-color:#0B0B0A;
  box-shadow:0 0 0 3px rgba(11,11,10,.055),0 6px 18px rgba(16,16,12,.1);
}
.pool-item.editing .px{display:none}
.pool-input{
  flex:1;min-width:0;width:100%;resize:none;border:none;background:transparent;padding:0;
  font-family:inherit;font-size:14.5px;line-height:1.45;color:var(--ink);overflow:hidden;
}

.stats{border-top:1px solid var(--line);padding:15px 0 18px;margin-top:12px}
.stats-total{font-size:13.5px;color:var(--ink-3);margin-bottom:9px;font-variant-numeric:tabular-nums}
.stat-bar{display:flex;height:3px;border-radius:2px;overflow:hidden;background:#F1F1ED;margin-bottom:12px}
.stat-bar i{display:block;height:100%}
.stat-legend{display:flex;flex-direction:column;gap:7px}
.stat-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.stat-row .dot{width:6px;height:6px;border-radius:50%;flex:none}
.stat-row .num{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- 编辑浮层 ---------- */
.pop{
  position:fixed;z-index:200;width:292px;background:#fff;
  border:1px solid var(--line-2);border-radius:12px;padding:13px;
  display:none;box-shadow:0 10px 34px rgba(0,0,0,.07);
}
.pop.open{display:block}
.pop-title{
  width:100%;font-size:16px;font-weight:600;padding:2px 2px 10px;
  border-bottom:1px solid var(--line);
}
.pop-title::placeholder{color:var(--ink-3);font-weight:400}
.pop-row{display:flex;align-items:center;gap:5px;margin-top:10px}
.pop-row input[type=time],.pop-row input[type=date]{
  flex:1;min-width:0;height:32px;border-radius:6px;border:1px solid var(--line-2);
  padding:0 8px;font-size:14px;font-variant-numeric:tabular-nums;background:#FCFCFA;
}
.pop-row input[type=time]::-webkit-calendar-picker-indicator{display:none}
.pop-row input[type=time]:focus,.pop-row input[type=date]:focus{background:#fff;border-color:var(--ink-3)}
.pop-row .dash{color:var(--ink-3);font-size:13px}
.pop-label{font-size:12px;color:var(--ink-3);margin:13px 0 7px;letter-spacing:.05em}
.pop-field{
  width:100%;height:32px;border-radius:6px;border:1px solid var(--line-2);
  padding:0 9px;font-size:14px;background:#FCFCFA;
}
select.pop-field{
  appearance:none;-webkit-appearance:none;padding-right:24px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%23B0B0AA' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;
}
.pop-field:focus{background-color:#fff;border-color:var(--ink-3)}
.pop-label-row{display:flex;align-items:center;justify-content:space-between;margin:13px 0 7px}
.pop-label-row .pop-label{margin:0}
.pop-edit{
  font-size:12px;color:var(--ink-3);padding:2px 0 2px 6px;
}
.pop-edit:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* 分类选项：圆点 + 名称，选中变黑 */
.pop-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cat-chip{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 8px;border-radius:999px;min-width:0;
  border:1.5px solid var(--line-2);background:#fff;
  font-size:13px;color:var(--ink-2);white-space:nowrap;
  transition:border-color .14s,color .14s,background .14s;
}
.cat-chip i{
  width:9px;height:9px;border-radius:50%;flex:none;background:var(--cc);
}
.cat-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cat-chip:hover{border-color:#C9C9C1;color:var(--ink)}
.cat-chip.on{border-color:#0B0B0A;background:#0B0B0A;color:#fff;font-weight:600}
.cat-chip.on i{box-shadow:0 0 0 2px rgba(255,255,255,.22)}

/* 分类编辑 */
.cat-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cat-row:last-child{margin-bottom:0}
.cat-sw{
  width:32px;height:32px;flex:none;border-radius:9px;overflow:hidden;
  border:1px solid var(--line-2);position:relative;cursor:pointer;
  background:var(--cc);
}
.cat-sw input[type=color]{
  position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);
  border:none;padding:0;background:transparent;cursor:pointer;
  opacity:0;
}
.cat-name{
  flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line-2);
  padding:0 10px;font-size:14px;color:var(--ink);background:#FCFCFA;
}
.cat-name:focus{background:#fff;border-color:var(--ink-3);outline:none}
.pop-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pop-foot .del{font-size:14px;color:var(--ink-3)}
.pop-foot .del:hover{color:var(--danger)}
.pop-foot .save{
  height:32px;padding:0 18px;border-radius:999px;background:#0B0B0A;color:#fff;font-size:14px;
}
.pop-foot .save:hover{background:#2E2E2B}

/* ---------- 导出菜单 ---------- */
.menu{
  position:fixed;z-index:210;width:190px;background:#fff;
  border:1px solid var(--line-2);border-radius:12px;padding:6px;display:none;
  box-shadow:0 10px 34px rgba(0,0,0,.07);
}
.menu.open{display:block}
.menu button{
  display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;
  font-size:14px;color:var(--ink-2);
}
.menu button:hover{background:#F5F5F2;color:var(--ink)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 0}

/* ---------- 拖动幽灵 ---------- */
.ghost{
  position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:999;
  background:#fff;border:1px solid var(--ink);border-radius:4px;
  padding:6px 11px;font-size:14px;color:var(--ink);
  max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
body.dragging{cursor:grabbing}
body.dragging,body.dragging *{user-select:none !important}

/* ---------- 设置面板 ---------- */
.sheet-mask{
  position:fixed;inset:0;background:rgba(11,11,10,.10);
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:290;
}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:318px;background:#fff;
  border-left:1px solid var(--line-2);box-shadow:-16px 0 48px rgba(0,0,0,.07);
  transform:translateX(100%);visibility:hidden;
  transition:transform .24s cubic-bezier(.32,.72,0,1),visibility .24s;
  z-index:300;display:flex;flex-direction:column;
}
.sheet.open{transform:none;visibility:visible}
.sheet-head{
  height:78px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
}
.sheet-head b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sheet-x{
  width:30px;height:30px;border-radius:50%;color:var(--ink-3);font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.sheet-x:hover{background:#F4F4F1;color:var(--ink)}
.sheet-body{flex:1;overflow-y:auto;padding:0 22px 28px}
.set-group{padding:15px 0;border-top:1px solid var(--line)}
.set-group:first-child{border-top:none;padding-top:2px}
.set-title{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:11px}
.set-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.set-title-row .set-title{margin-bottom:0}
.set-link{font-size:12.5px;color:var(--ink-3);padding:2px 0;letter-spacing:.02em}
.set-link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:30px;margin-bottom:9px;
}
.set-row:last-child{margin-bottom:0}
.set-row>span{font-size:14px;color:var(--ink-2);flex:none}
.set-row.col{flex-direction:column;align-items:stretch;gap:9px}
.seg2{display:inline-flex;background:#F3F3F0;border-radius:7px;padding:2px}
.seg2 button{height:25px;padding:0 9px;border-radius:5px;font-size:13px;color:var(--ink-2)}
.seg2 button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.09)}
.set-pair{display:flex;align-items:center;gap:4px}
.set-pair select{
  height:27px;border-radius:6px;border:1px solid var(--line-2);background:#FCFCFA;
  font-size:13.5px;padding:0 2px;font-variant-numeric:tabular-nums;
}
.set-pair .dash{color:var(--ink-3);font-size:13px}
.set-btn{
  height:27px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
  font-size:13.5px;color:var(--ink-2);flex:none;
}
.set-btn:hover{border-color:#CFCFC8;color:var(--ink)}
.set-btn.danger{color:var(--danger);border-color:#E8D5D0}
.set-btn.danger:hover{background:#FBF1EF}
.set-btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ---------- 打印 ---------- */
.print-title{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .topbar,.pool,.pop,.menu,.ghost,.sheet,.sheet-mask,.now-ghost{display:none !important}
  .layout{display:block;height:auto}
  .canvas{overflow:visible;height:auto;padding-left:0}
  .grid{--hour-h:min(34px,calc(620px / var(--hours,18))) !important;max-width:none !important;margin:0 !important}
  .grid.v-day{--hour-h:min(48px,calc(950px / var(--hours,18))) !important}
  .grid.v-day{max-width:100% !important}
  .grid.v-day .grid-head{display:none}
  .grid-head{position:static}
  .gh-day{border-bottom-width:2px}
  .grid.v-week .gh-day .gd,.grid.v-day .gh-day .gd{font-size:15px}
  .grid.v-week .gh-day .gn,.grid.v-day .gh-day .gn{font-size:11px}
  .print-title{
    display:block;font-size:15px;font-weight:700;padding:0 0 10px 54px;color:#0B0B0A;
  }
  .blk{cursor:default;background:#fff !important;outline:0.5pt solid rgba(0,0,0,.34);outline-offset:-0.5pt}
  .blk .bt{font-size:9px;-webkit-line-clamp:2}
  .blk .bs{display:none}
  .blk .chk{display:none !important}
  .blk .rz{display:none}
  .cols{background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,transparent 1px var(--hour-h))}
  .tick{color:#8A8A85}
  /* 列表视图打印：行高跟着屏幕走（十二行正好铺满一页），胶囊换成描边省墨 */
  .lv{padding:0;max-width:none}
  .lv-cols{gap:9px}
  .lv-head{position:static;min-height:0;break-inside:avoid}
  .lv-row{break-inside:avoid;border-bottom:0.5pt solid #E4E2DA}
  .lv-row .chk,.lv-row.is-empty::after{display:none !important}
  .lv-chip{
    background:#fff !important;color:#0B0B0A !important;
    box-shadow:inset 0 0 0 0.7pt rgba(0,0,0,.45);
  }
  .lv-row.done .lv-chip{color:#8A8A85 !important}
  body.is-list .print-title{padding-left:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-left">
    <span class="range-main" id="rangeMain"></span>
    <span class="range-sub" id="rangeSub"></span>
  </div>
  <div class="tb-right">
    <button class="arrow" id="prevBtn" title="上一周"><svg width="7" height="12" viewBox="0 0 7 12"><path d="M6 1L1.6 6L6 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow" id="nextBtn" title="下一周"><svg width="7" height="12" viewBox="0 0 7 12"><path d="M1 1L5.4 6L1 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="today-btn" id="todayBtn">今天</button>
    <div class="seg" id="viewSeg">
      <span class="seg-thumb" id="segThumb"></span>
      <button data-view="day">日</button>
      <button data-view="week" class="on">周</button>
    </div>
    <button class="icon-btn viewbtn" id="listBtn" title="列表视图">
      <svg class="i-grid" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1.9" y="3" width="12.2" height="10" rx="1.8"/><path d="M6.1 3v10M10 3v10"/></svg>
      <svg class="i-list" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.7 4h8M5.7 8h8M5.7 12h8"/><path d="M2.6 4h.01M2.6 8h.01M2.6 12h.01" stroke-width="2.1"/></svg>
    </button>
    <button class="primary" id="exportBtn">导出</button>
    <button class="icon-btn" id="setBtn" title="设置">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <section class="canvas" id="canvas">
    <div class="print-title" id="printTitle"></div>
    <div class="grid" id="grid"></div>
    <div class="lv" id="listView"></div>
  </section>
  <aside class="pool" id="pool">
    <div class="pool-resizer" id="poolResizer"></div>
    <div class="pool-head">待办池</div>
    <div class="pool-list" id="poolList"></div>
    <form class="pool-add" id="poolForm">
      <button type="button" class="pool-trigger" id="poolTrigger">＋ 记一件待排的事</button>
      <div class="pool-editor">
        <textarea id="poolInput" rows="2" placeholder="要做什么？" autocomplete="off"></textarea>
        <div class="pool-editor-foot">
          <button type="button" class="pe-cancel" id="poolCancel">取消</button>
          <button type="submit" class="pe-add">添加</button>
        </div>
      </div>
    </form>
    <div class="stats" id="stats"></div>
  </aside>
</div>

<div class="pop" id="pop">
  <input class="pop-title" id="popTitle" placeholder="做点什么" autocomplete="off">
  <div class="pop-row">
    <input type="date" id="popDate">
  </div>
  <div class="pop-row">
    <input type="time" id="popStart" step="300">
    <span class="dash">—</span>
    <input type="time" id="popEnd" step="300">
  </div>
  <div class="pop-label-row">
    <span class="pop-label">分类</span>
    <button type="button" class="pop-edit" id="popEditCat">修改</button>
  </div>
  <div class="pop-cats" id="popCats"></div>
  <div class="pop-label">重复</div>
  <select class="pop-field" id="popRepeat">
    <option value="">不重复</option>
    <option value="daily">每天</option>
    <option value="weekly">每周</option>
  </select>
  <div class="pop-label">备注</div>
  <input class="pop-field" id="popNote" placeholder="描述一下" autocomplete="off">
  <div class="pop-foot">
    <button class="del" id="popDel">删除</button>
    <button class="save" id="popSave">完成</button>
  </div>
</div>

<div class="menu" id="exportMenu">
  <button data-act="png-phone">图片 · 手机竖版</button>
  <button data-act="png-a4">图片 · A4 日程表</button>
  <button data-act="pdf">打印 / 存为 PDF</button>
  <hr>
  <button data-act="backup">导出数据备份</button>
  <button data-act="restore">导入数据备份</button>
</div>
<div class="sheet-mask" id="setMask"></div>
<aside class="sheet" id="setSheet">
  <div class="sheet-head">
    <b>设置</b>
    <button class="sheet-x" id="setClose" title="关闭">×</button>
  </div>
  <div class="sheet-body">
    <div class="set-group">
      <div class="set-title">时间轴</div>
      <div class="set-row">
        <span>显示范围</span>
        <div class="set-pair">
          <select id="setStart"></select>
          <span class="dash">—</span>
          <select id="setEnd"></select>
